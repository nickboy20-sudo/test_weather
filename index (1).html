    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap');

  <body>
    <div class="app">
      <div class="atmosphere" id="atmosphere" aria-hidden="true">
        <div class="stars"></div><div class="sun-ring"></div><div class="cloud"></div><div class="cloud c2"></div><div class="weather-fog"></div><div class="weather-fog two"></div>
        <div class="rain-layer" id="rain-layer"></div><div class="snow-layer" id="snow-layer"></div>
      </div>
      <main class="site" id="app"></main>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <script>
      (() => {
        "use strict";
        const fallback = { name: "București", latitude: 44.4268, longitude: 26.1025, country: "România" };
        const codeNames = { 0:"Cer senin",1:"Predominant senin",2:"Parțial noros",3:"Acoperit",45:"Ceață",48:"Ceață cu chiciură",51:"Burniță ușoară",53:"Burniță",55:"Burniță densă",56:"Burniță înghețată",57:"Burniță înghețată densă",61:"Ploaie slabă",63:"Ploaie",65:"Ploaie puternică",66:"Ploaie înghețată",67:"Ploaie înghețată puternică",71:"Ninsoare slabă",73:"Ninsoare",75:"Ninsoare puternică",77:"Fulguială",80:"Averse slabe",81:"Averse",82:"Averse puternice",85:"Averse de ninsoare",86:"Averse de ninsoare puternice",95:"Furtună",96:"Furtună cu grindină",99:"Furtună cu grindină puternică" };
        const icons = {
          sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>',
          moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.3 14.2A8 8 0 0 1 9.8 3.7 8.2 8.2 0 1 0 20.3 14.2Z"/></svg>',
          cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 18h10.2a4.2 4.2 0 0 0 .3-8.4A5.7 5.7 0 0 0 6.4 8.2 4.9 4.9 0 0 0 7 18Z"/></svg>',
          rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 14h10.2a4.2 4.2 0 0 0 .3-8.4A5.7 5.7 0 0 0 6.4 4.2 4.9 4.9 0 0 0 7 14Z"/><path d="m8 17-1 3m5-3-1 3m5-3-1 3"/></svg>',
          snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 13h10.2a4.2 4.2 0 0 0 .3-8.4A5.7 5.7 0 0 0 6.4 3.2 4.9 4.9 0 0 0 7 13Z"/><path d="M8 17v4m-2-2h4m6-2v4m-2-2h4"/></svg>',
          fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 9h14M3 13h18M6 17h12"/></svg>',
          bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m13 2-8 12h6l-1 8 8-12h-6l1-8Z"/></svg>',
          pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
          search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
          locate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>',
          refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 11a8 8 0 0 0-14-4L4 9m0-5v5h5M4 13a8 8 0 0 0 14 4l2-2m0 5v-5h-5"/></svg>',
          drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5S6.5 10 6.5 14.2a5.5 5.5 0 0 0 11 0C17.5 10 12 3.5 12 3.5Z"/></svg>',
          wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10a2.5 2.5 0 1 0-2.4-3.3M3 12h15a2.5 2.5 0 1 1-2.4 3.3M3 16h8"/></svg>',
          eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>',
          gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="m12 12 4-3"/></svg>',
          activity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>',
          sunrise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18h18M6 15a6 6 0 0 1 12 0M12 3v3m-6.4-.4 2.1 2.1m10.6-2.1-2.1 2.1"/></svg>',
          nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 6.3 16 3.1-6.6L20 10 4 4Z"/></svg>'
        };
        const state = { location: { ...fallback }, weather: null, air: null, selected: 0, suggestions: [], query: "", loading: true, error: "" };
        let searchRequest = 0;
        const app = document.getElementById("app");
        const atmosphere = document.getElementById("atmosphere");
        const toast = document.getElementById("toast");
        const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[char]));
        const icon = (name, size = 22) => `<span style="width:${size}px;height:${size}px;display:inline-flex">${icons[name] || icons.cloud}</span>`;
        const isRain = (code) => (code >= 51 && code <= 67) || code >= 80;
        const isSnow = (code) => (code >= 71 && code <= 77) || (code >= 85 && code <= 86);
        const isStorm = (code) => code >= 95;
        const weatherIcon = (code, day = true) => {
          if (!day && code <= 2) return "moon";
          if (code === 0) return "sun";
          if (code === 1) return "cloud";
          if (code === 2 || code === 3) return "cloud";
          if (code >= 45 && code <= 48) return "fog";
          if (isRain(code)) return isStorm(code) ? "bolt" : "rain";
          if (isSnow(code)) return "snow";
          return "cloud";
        };
        const dateObj = (value) => new Date(`${value}${value.length === 10 ? "T12:00:00" : ""}`);
        const timeLabel = (value) => new Intl.DateTimeFormat("ro-RO", { hour:"2-digit", minute:"2-digit" }).format(dateObj(value));
        const dayLabel = (value, index) => index === 0 ? "Astăzi" : new Intl.DateTimeFormat("ro-RO", { weekday:"short", day:"numeric", month:"short" }).format(dateObj(value)).replace(".", "");
        const mm = (value) => `${Number(value || 0).toFixed(value < .1 ? 1 : 1)} mm`;
        const formatVisibility = (meters) => meters > 999 ? `${(meters / 1000).toFixed(1)} km` : `${Math.round(meters)} m`;
        const weatherText = (code) => codeNames[code] || "Vreme schimbătoare";
        const showToast = (text) => { toast.textContent = text; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 3300); };

        function makeAtmosphere() {
          const rain = document.getElementById("rain-layer"), snow = document.getElementById("snow-layer");
          rain.innerHTML = Array.from({ length: 40 }, (_, i) => `<i class="rain-drop" style="--left:${(i * 2.63) % 104}%;--speed:${.6 + (i % 7) * .12}s;--delay:-${(i % 12) * .34}s"></i>`).join("");
          snow.innerHTML = Array.from({ length: 34 }, (_, i) => `<i class="snow-flake" style="--left:${(i * 3.08) % 104}%;--speed:${5 + (i % 7) * .7}s;--delay:-${(i % 11) * .7}s"></i>`).join("");
        }

        async function loadWeather(location = state.location) {
          state.loading = true; state.error = ""; render();
          const params = new URLSearchParams({
            latitude: location.latitude, longitude: location.longitude, timezone: "auto", forecast_days: "10",
            current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,visibility",
            hourly: "temperature_2m,precipitation_probability,precipitation,wind_speed_10m,weather_code",
            daily: "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_sum,precipitation_probability_max,sunrise,sunset"
          });
          const airParams = new URLSearchParams({ latitude: location.latitude, longitude: location.longitude, timezone: "auto", current: "european_aqi,pm2_5,pm10" });
          try {
            const [weatherResponse, airResponse] = await Promise.all([
              fetch(`https://api.open-meteo.com/v1/forecast?${params}`),
              fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${airParams}`)
            ]);
            if (!weatherResponse.ok) throw new Error("Nu am putut încărca prognoza.");
            state.weather = await weatherResponse.json();
            state.air = airResponse.ok ? await airResponse.json() : null;
            state.location = { ...location };
            state.selected = 0;
            localStorage.setItem("meteo-location", JSON.stringify(state.location));
            localStorage.setItem("meteo-weather", JSON.stringify({ weather: state.weather, air: state.air, location: state.location, saved: Date.now() }));
          } catch (error) {
            const cached = JSON.parse(localStorage.getItem("meteo-weather") || "null");
            if (cached?.weather) { state.weather = cached.weather; state.air = cached.air; state.location = cached.location || location; showToast("Afișez ultima prognoză salvată."); }
            else state.error = error.message || "Serviciul meteo nu este disponibil.";
          }
          state.loading = false; render();
        }

        async function searchLocations(query) {
          const requestId = ++searchRequest;
          if (query.trim().length < 2) { state.suggestions = []; updateSuggestions(); return; }
          try {
            const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=ro&format=json`);
            const data = await response.json();
            if (requestId !== searchRequest) return;
            state.suggestions = (data.results || []).map((item) => ({ name:item.name, latitude:item.latitude, longitude:item.longitude, country:item.country, admin1:item.admin1 })).filter((item) => item.country);
          } catch {
            if (requestId !== searchRequest) return;
            state.suggestions = [];
          }
          updateSuggestions();
        }

        function updateSuggestions() {
          const box = document.getElementById("suggestions");
          if (!box) return;
          box.classList.toggle("open", state.suggestions.length > 0);
          box.innerHTML = state.suggestions.map((item, index) => `<button class="suggestion" type="button" data-suggestion="${index}">${icon("pin", 17)}<div><b>${esc(item.name)}</b><span>${esc([item.admin1, item.country].filter(Boolean).join(", "))}</span></div></button>`).join("");
          box.querySelectorAll("[data-suggestion]").forEach((button) => button.addEventListener("click", () => {
            const selected = state.suggestions[Number(button.dataset.suggestion)];
            state.query = ""; document.getElementById("search-input").value = ""; box.classList.remove("open"); state.suggestions = []; loadWeather(selected);
          }));
        }

        function metric(iconName, label, value, note, testId) {
          return `<div class="metric" data-testid="${testId}">${icon(iconName, 21)}<div><div class="metric-label">${label}</div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div></div>`;
        }

        function points(values, width, height, pad = 12) {
          const max = Math.max(...values, 1), min = Math.min(...values, 0), range = max - min || 1;
          return values.map((value, index) => {
            const x = pad + (index / Math.max(values.length - 1, 1)) * (width - pad * 2);
            const y = height - pad - ((value - min) / range) * (height - pad * 2);
            return [x, y];
          });
        }
        function linePath(coords) { return coords.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" "); }
        function Chart({ temps, rain, labels }) {
          const width = 760, height = 185, tempPoints = points(temps, width, height, 20), rainMax = Math.max(...rain, .4);
          const rainBars = rain.map((value, i) => { const x = 20 + (i / Math.max(rain.length - 1, 1)) * (width - 40); const barH = (value / rainMax) * 63; return `<rect x="${x - 3}" y="${height - 20 - barH}" width="6" height="${barH}" rx="3" fill="#edb54d" opacity=".78"/>`; }).join("");
          const grid = [0,1,2,3].map((i) => { const y = 20 + i * 48; return `<line x1="20" x2="740" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 5"/>`; }).join("");
          const labelText = labels.filter((_, i) => i % Math.max(1, Math.floor(labels.length / 6)) === 0).map((label, i) => `<text x="${20 + (labels.indexOf(label) / Math.max(labels.length - 1, 1)) * 720}" y="180" fill="rgba(255,255,255,.72)" font-size="10" font-family="DM Mono">${esc(label)}</text>`).join("");
          return `<svg class="svg-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafic temperatură și precipitații">${grid}${rainBars}<path d="${linePath(tempPoints)}" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${tempPoints.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#3f9bdc" stroke="#ffffff" stroke-width="2.5"/>`).join("")}${labelText}</svg>`;
        }
        function Rain10Chart({ values, dates }) {
          const width = 900, height = 220, left = 38, right = 18, top = 28, bottom = 45;
          const max = Math.max(...values.map((value) => Number(value || 0)), 1);
          const plotHeight = height - top - bottom, slot = (width - left - right) / Math.max(values.length, 1);
          const grid = [0, .33, .66, 1].map((ratio) => {
            const y = height - bottom - ratio * plotHeight;
            return `<line x1="${left}" x2="${width - right}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="4" y="${y + 4}" fill="rgba(255,255,255,.6)" font-size="10" font-family="DM Mono">${(max * ratio).toFixed(1)}</text>`;
          }).join("");
          const bars = values.map((rawValue, index) => {
            const value = Number(rawValue || 0), barWidth = Math.min(42, slot * .58);
            const x = left + index * slot + (slot - barWidth) / 2, barHeight = value > 0 ? Math.max(5, value / max * plotHeight) : 2, y = height - bottom - barHeight;
            const label = dayLabel(dates[index], index).replace("sept.", "sept");
            return `<g><title>${esc(label)}: ${mm(value)}</title><rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="8" fill="#ffd66b" opacity=".92"/><text x="${x + barWidth / 2}" y="${Math.max(16, y - 8)}" fill="#fff" font-size="10" text-anchor="middle" font-family="DM Mono">${value.toFixed(1)}</text><text x="${x + barWidth / 2}" y="${height - 17}" fill="rgba(255,255,255,.72)" font-size="10" text-anchor="middle" font-family="DM Mono">${esc(label)}</text></g>`;
          }).join("");
          return `<svg class="rain-bars-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafic precipitații pe 10 zile în milimetri">${grid}${bars}</svg>`;
        }
        function WindChart({ values, labels }) {
          const width = 700, height = 165, coords = points(values, width, height, 20), grid = [0,1,2,3].map((i) => `<line x1="20" x2="680" y1="${18 + i * 38}" y2="${18 + i * 38}" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 5"/>`).join("");
          const labelsSvg = labels.map((label, i) => i % 4 === 0 ? `<text x="${20 + (i / Math.max(labels.length - 1, 1)) * 660}" y="160" fill="rgba(255,255,255,.72)" font-size="10" font-family="DM Mono">${esc(label)}</text>` : "").join("");
          return `<svg class="svg-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafic viteza vântului">${grid}<path d="${linePath(coords)}" fill="none" stroke="#bfe8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#3f9bdc" stroke="#bfe8ff" stroke-width="2.5"/>`).join("")}${labelsSvg}</svg>`;
        }

        function render() {
          if (state.loading && !state.weather) {
            app.innerHTML = `<div class="loading"><div><div class="loader-ring"></div><p style="margin-top:15px;color:var(--muted);font-size:13px">Aduc prognoza pentru ${esc(state.location.name)}…</p></div></div>`; return;
          }
          if (state.error && !state.weather) {
            app.innerHTML = `<div class="error-state"><p class="eyebrow">Serviciul meteo</p><h1>Nu am putut deschide cerul.</h1><p style="color:var(--muted);line-height:1.6">${esc(state.error)}</p><button class="primary-btn" id="retry">Încearcă din nou</button></div>`;
            document.getElementById("retry").onclick = () => loadWeather(state.location); return;
          }
          const w = state.weather, c = w.current, d = w.daily, h = w.hourly, day = state.selected;
          const now = new Date(), todayIndex = Math.max(0, h.time.findIndex((time) => new Date(time) >= new Date(now.getTime() - 3600000)));
          const hours = h.time.slice(todayIndex, todayIndex + 12);
          const selectedDate = d.time[day], dayStart = Math.max(0, h.time.findIndex((time) => time.startsWith(selectedDate)));
          const selectedTemps = h.temperature_2m.slice(dayStart, dayStart + 24);
          const selectedRain = h.precipitation.slice(dayStart, dayStart + 24);
          const selectedLabels = h.time.slice(dayStart, dayStart + 24).map(timeLabel);
          const windStart = todayIndex, windValues = h.wind_speed_10m.slice(windStart, windStart + 25), windLabels = h.time.slice(windStart, windStart + 25).map(timeLabel);
          const rain10Total = d.precipitation_sum.reduce((total, value) => total + Number(value || 0), 0);
          const mood = !c.is_day ? "is-night" : isRain(c.weather_code) ? "is-rain" : isSnow(c.weather_code) ? "is-snow" : "";
          atmosphere.className = `atmosphere ${mood}`;
          app.innerHTML = `
            <header class="topbar">
              <a class="brand" href="#" aria-label="Meteo România">${icon("sun", 40)}<span><small>METEO</small><strong>ROMÂNIA</strong></span></a>
              <div class="search-zone">
                <div class="search-wrap">${icon("search", 18)}<input id="search-input" type="search" autocomplete="off" placeholder="Caută un oraș din România…" aria-label="Caută un oraș" value="${esc(state.query)}"></div>
                <div id="suggestions" class="suggestions" role="listbox" aria-label="Sugestii locații"></div>
              </div>
              <div class="actions"><button class="icon-btn" id="gps" type="button" title="Folosește locația mea">${icon("locate", 17)}<span>Locația mea</span></button><button class="icon-btn compact" id="refresh" type="button" title="Actualizează prognoza">${icon("refresh", 17)}</button></div>
            </header>
            <section class="hero-grid">
              <article class="card hero" data-testid="current-weather">
                <div class="hero-top"><div class="hero-location">${icon("pin", 15)} <b>${esc(state.location.name)}</b><br><span style="display:inline-block;margin:8px 0 0 20px">${new Intl.DateTimeFormat("ro-RO", { weekday:"long", day:"numeric", month:"long" }).format(new Date())}</span></div><span class="day-pill">${c.is_day ? "ZI" : "NOAPTE"}</span></div>
                <div><div class="hero-temp"><strong>${Math.round(c.temperature_2m)}°</strong><span>se simte ca<b>${Math.round(c.apparent_temperature)}°</b></span></div><div class="hero-condition">${icon(weatherIcon(c.weather_code, Boolean(c.is_day)), 26)}<span>${weatherText(c.weather_code)}</span></div></div>
              </article>
              <article class="card summary"><p class="eyebrow">Acum, pe scurt</p><h1>${c.weather_code === 0 ? "O fereastră clară spre ziua ta." : "Cerul îți spune ce urmează."}</h1><p>Aerul din ${esc(state.location.name)} se schimbă încet. Iată ce merită știut înainte să ieși.</p><div class="metrics">
                ${metric("thermometer","Resimțită",`${Math.round(c.apparent_temperature)}°`,"temperatura pielii","metric-feels-like")}
                ${metric("drop","Umiditate",`${Math.round(c.relative_humidity_2m)}%`,"aer relativ","metric-humidity")}
                ${metric("wind","Vânt",`${Math.round(c.wind_speed_10m)} km/h`,"S · constant","metric-wind")}
                ${metric("eye","Vizibilitate",formatVisibility(c.visibility),"orizont vizibil","metric-visibility")}
                ${metric("gauge","Presiune",`${Math.round(c.surface_pressure)} hPa`,"la nivelul mării","metric-pressure")}
                ${metric("activity","Calitatea aerului",state.air?.current?.european_aqi ? `AQI ${Math.round(state.air.current.european_aqi)}` : "Bună",state.air?.current?.european_aqi < 50 ? "aer curat" : "verificată acum","metric-air-quality")}
              </div></article>
            </section>
            <section class="card section"><div class="hourly-layout"><div><div class="section-heading"><div><p class="eyebrow">Ritm pe ore</p><h2>Cum se schimbă ziua</h2></div><span class="mono">următoarele 12 ore</span></div><div class="hourly-list">${hours.map((time, i) => { const idx = todayIndex + i; return `<div class="hour ${i === 0 ? "current" : ""}" data-testid="hour-${i}"><div class="hour-time">${i === 0 ? "Acum" : timeLabel(time)}</div><div class="hour-icon">${icon(weatherIcon(h.weather_code[idx], true), 25)}</div><div class="hour-temp">${Math.round(h.temperature_2m[idx])}°</div><div class="rain-chance">${icon("drop", 11)} ${h.precipitation_probability[idx] || 0}%</div></div>`; }).join("")}</div></div>
              <div class="sun-card"><div><p class="eyebrow">Lumina zilei</p><h3>Soarele se mișcă</h3></div><div><div class="sun-times"><div>Răsărit<b>${timeLabel(d.sunrise[0])}</b></div><div style="text-align:right">Apus<b>${timeLabel(d.sunset[0])}</b></div></div><div class="sun-track"><i class="sun-dot"></i></div><p class="sun-copy">O zi cu aproximativ <b>${Math.max(0, Math.round((dateObj(d.sunset[0]) - dateObj(d.sunrise[0])) / 3600000))} ore de lumină</b>. Bună pentru o plimbare fără grabă.</p></div></div>
            </div></section>
            <section class="card section"><div class="section-heading"><div><p class="eyebrow">Privire înainte</p><h2>Următoarele zile</h2></div><span class="mono">10 zile · mm de ploaie</span></div><div class="days">${d.time.map((date, i) => `<button class="day ${i === day ? "selected" : ""}" data-day="${i}" type="button" aria-label="Prognoza pentru ${dayLabel(date,i)}" aria-pressed="${i === day}"><div class="day-date">${dayLabel(date,i)}</div><div class="day-code">${icon(weatherIcon(d.weather_code[i]), 30)}</div><div class="day-temp"><b>${Math.round(d.temperature_2m_max[i])}°</b><small>${Math.round(d.temperature_2m_min[i])}°</small></div><div class="day-rain">${icon("drop", 12)} ${mm(d.precipitation_sum[i])}</div></button>`).join("")}</div></section>
            <section class="card section rain-10-card" data-testid="rain-10-day-chart"><div class="section-heading"><div><p class="eyebrow">Precipitații</p><h2>Acumulare de ploaie în 10 zile</h2></div><span class="rain-total">${mm(rain10Total)}</span></div><div class="chart-meta"><span><i class="legend-dot rain"></i>milimetri estimați pe zi</span><span>Totalul este calculat din prognoza zilnică</span></div><div class="chart-frame">${Rain10Chart({ values: d.precipitation_sum, dates: d.time })}</div></section>
             <section class="chart-grid section" style="padding:0;background:none;border:0;box-shadow:none"><article class="card section" style="margin:0" data-testid="day-detail-chart"><div class="section-heading"><div><p class="eyebrow">${day === 0 ? "Astăzi" : "Detaliul zilei"}</p><h2>${dayLabel(selectedDate, day)} · temperatură și ploaie</h2></div><span class="mono">${mm(d.precipitation_sum[day])}</span></div><div class="chart-meta"><span><i class="legend-dot"></i>temperatură °C</span><span><i class="legend-dot rain"></i>precipitații mm</span></div><div class="chart-frame">${Chart({ temps: selectedTemps.length > 1 ? selectedTemps : [d.temperature_2m_min[day],d.temperature_2m_max[day]], rain: selectedRain.length > 1 ? selectedRain : [0, d.precipitation_sum[day]], labels: selectedLabels.length > 1 ? selectedLabels : ["ziua"] })}</div></article>
              <article class="card section" style="margin:0" data-testid="wind-chart"><div class="section-heading"><div><p class="eyebrow">Aer în mișcare</p><h2>Vânt · următoarele 24 h</h2></div><span class="mono">${Math.round(c.wind_speed_10m)} km/h</span></div><div class="chart-meta"><span><i class="legend-dot" style="background:#527c94"></i>viteză km/h</span></div><div class="chart-frame">${WindChart({ values: windValues.length > 1 ? windValues : [c.wind_speed_10m], labels: windLabels.length > 1 ? windLabels : ["acum"] })}</div></article>
            </section>
             <section class="card section radar"><div class="radar-head"><div class="section-heading"><div><p class="eyebrow">Harta atmosferei</p><h2>Radarul României</h2><p style="color:var(--muted);font-size:13px;margin:9px 0 0">Stratul radar arată precipitațiile observate aproape în timp real.</p></div><a class="radar-link" target="_blank" rel="noreferrer" href="https://www.windy.com/${state.location.latitude}/${state.location.longitude}?radar,${state.location.latitude},${state.location.longitude},7">${icon("nav", 15)} Deschide radarul complet</a></div></div><div class="radar-frame"><iframe title="Radar meteo pentru România" loading="lazy" src="https://embed.windy.com/embed2.html?lat=${state.location.latitude}&lon=${state.location.longitude}&detailLat=${state.location.latitude}&detailLon=${state.location.longitude}&width=650&height=450&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=true&marker=true&pressure=&type=map&location=coordinates&detail=false&metricWind=km%2Fh&metricTemp=%C2%B0C"></iframe><div class="radar-note">Dacă radarul nu se încarcă, deschide radarul complet.</div></div></section>
            <footer class="footer"><span>METEO / ROMÂNIA</span><span>Date oferite de Open‑Meteo · actualizate la cerere</span><span>metric · °C · km/h · mm</span></footer>`;
          bindEvents();
        }

        function bindEvents() {
          const input = document.getElementById("search-input");
          input.addEventListener("input", (event) => { state.query = event.target.value; searchLocations(state.query); });
          input.addEventListener("focus", () => { if (state.query.trim().length >= 2) searchLocations(state.query); });
          input.addEventListener("keydown", (event) => { if (event.key === "Escape") { state.suggestions = []; updateSuggestions(); } });
          document.onclick = (event) => { if (!event.target.closest(".search-zone")) { state.suggestions = []; updateSuggestions(); } };
          document.getElementById("refresh").onclick = () => loadWeather(state.location);
          document.getElementById("gps").onclick = () => {
            if (!navigator.geolocation) { showToast("Geolocația nu este disponibilă în acest browser."); return; }
            showToast("Caut locația ta…");
            navigator.geolocation.getCurrentPosition((position) => loadWeather({ name:"Locația mea", latitude:position.coords.latitude, longitude:position.coords.longitude, country:"" }), () => showToast("Nu am putut accesa locația. Verifică permisiunea browserului."));
          };
          document.querySelectorAll("[data-day]").forEach((button) => button.onclick = () => { state.selected = Number(button.dataset.day); render(); document.querySelector('[data-testid="day-detail-chart"]')?.scrollIntoView({ behavior:"smooth", block:"center" }); });
          document.querySelector(".brand").onclick = (event) => { event.preventDefault(); window.scrollTo({ top:0, behavior:"smooth" }); };
        }

        makeAtmosphere();
        const savedLocation = JSON.parse(localStorage.getItem("meteo-location") || "null");
        loadWeather(savedLocation || fallback);
      })();
    </script>
  </body>
</html>
